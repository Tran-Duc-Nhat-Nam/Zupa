  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  safe_device: ^1.4.1
  flutter_animate: ^4.5.2
  flutter_displaymode: ^0.7.0
  fl_chart: ^1.2.0
  another_flushbar: ^2.2.4
  fluttertoast: ^10.0.0
  firebase_messaging: ^16.6.0
  firebase_core: ^4.14.0
  google_mlkit_text_recognition: ^0.17.1
  flutter_gemma: ^1.7.1
  flutter_gemma_litertlm: ^1.6.2
  gpt_markdown: ^1.2.1
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  material3_expressive_loading_indicator: ^0.1.2
  m3_expressive: ^1.0.0
  material_new_shapes: ^1.0.0
  file_picker: ^12.2.0
  usb_debug_checker: ^0.0.2
  material_ui: ^1.1.1
  cupertino_ui: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11
  flutter_launcher_icons: ^0.14.4
  injectable_generator: ^3.1.3
  slang_build_runner: ^4.19.0
  envied_generator: ^1.3.8
  auto_route_generator: ^10.6.0
  isar_community_generator:
    git:
      url: https://github.com/Helohi/isar-community.git
      ref: v3
      path: packages/isar_community_generator
  reactive_forms_generator:
    git:
      url: https://github.com/Tran-Duc-Nhat-Nam-270702/reactive_forms_generator.git
      ref: master
      path: packages/reactive_forms_generator

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sites.json

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex-VariableFont.ttf
