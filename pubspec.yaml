  sdk: ^3.14.0-95.2.beta
  flutter: 3.48.0-0.4.pre

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^11.1.0
  reactive_forms: ^18.2.2
  reactive_forms_annotations: ^8.5.0
  shared_preferences: ^2.5.5
  retrofit: ^4.10.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  dio: ^5.11.1
  dio_smart_retry: ^7.0.1
  dio_cache_interceptor: ^4.0.7
  http_cache_isar_store:
    git:
      url: https://github.com/Tran-Duc-Nhat-Nam-270702/dart_http_cache.git
      ref: master
      path: http_cache_isar_store
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  easy_refresh: ^3.5.1
  internet_connection_checker_plus: ^3.1.1
  skeletonizer: ^2.1.3
  nfc_manager: ^4.2.1
  volume_button_listener: ^0.3.1
  camera: ^0.12.1
  versionarte: ^2.1.1
  flutter_smart_dialog: ^5.3.0
  animated_segmented_tab_control: ^2.1.0
  extended_image: ^10.1.0
